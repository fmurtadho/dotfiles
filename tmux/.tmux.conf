# Shell
set -g default-shell /opt/homebrew/bin/fish
# set -g default-shell /bin/bash

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*256col*:RGB"

# Extended keys: pass Shift/Ctrl+Enter, Ctrl+Tab etc. through to apps (nvim, Claude Code)
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# Copy mode (vi keys)
set -g mode-keys vi
set -g set-clipboard on

# Behavior
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g mouse on
set -g focus-follows-mouse on
set -g base-index 1              # windows start at 1 (easier to reach on keyboard)
setw -g pane-base-index 1
set -g status-interval 5
set -g history-limit 50000
set -g detach-on-destroy off     # closing a session switches to another instead of detaching
set -g display-time 1500

# ── Key bindings ──
bind r source-file ~/.tmux.conf \; display "reloaded"

# Splits / windows open in the current pane's directory
bind '\' split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Resize panes (-r: press prefix once, then tap repeatedly)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reorder windows
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Popups
bind g display-popup -E -w 90% -h 90% -T " lazygit " -d "#{pane_current_path}" lazygit
bind s display-popup -E -w 50% -h 40% -T " sessions " "sh -c 's=\$(tmux list-sessions -F \"#S\" | fzf --reverse --no-info --prompt \"› \" --pointer \"▌\" --color=bg+:#2e383c,fg:#859289,fg+:#d3c6aa,hl:#a7c080,hl+:#a7c080,prompt:#83c092,pointer:#a7c080,gutter:-1) && tmux switch-client -t \"\$s\"'"

# Vim-style selection; copies go to the system clipboard via set-clipboard (OSC 52)
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
# Mouse select copies but stays in place instead of jumping to the bottom
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# ─────────────────────────────────────────────
# Everforest (Dark, Hard) — matches Ghostty / WezTerm
#   bg_dim #1e2326  bg0 #272e33  bg1 #2e383c  bg2 #374145  bg3 #414b50
#   fg  #d3c6aa  grey0 #7a8478  grey1 #859289
#   green #a7c080  yellow #dbbc7f  aqua #83c092  red #e67e80
# ─────────────────────────────────────────────

# Pane backgrounds follow the terminal
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# ── Status bar: darker bg_dim strip, like the WezTerm tab bar ──
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#1e2326,fg=#859289"

# Window list styled like the WezTerm tab bar: the current window is a rounded pill,
# the others plain grey text. Pill is green normally, yellow while prefix is held,
# aqua in copy mode. Inactive tabs are padded to the same width so nothing shifts.
set -g status-left-length 10
set -g status-left " "

# Right: session name (hidden when it's just a number) + git branch of the active pane,
# or its folder when it's not in a repo (see ~/.config/tmux/status-right.sh)
set -g status-right-length 60
set -g status-right "#{?#{m/r:^[0-9]+$,#S},,#[fg=#7a8478]#S  }#($HOME/.config/tmux/status-right.sh '#{pane_current_path}')  "

set -g window-status-separator ""
setw -g window-status-style "none"
setw -g window-status-current-style "none"     # tmux 3.8 defaults this to underscore
setw -g window-status-format         "  #I #W#{?window_zoomed_flag, [z],}  "
setw -g window-status-current-format "#{?client_prefix,#[fg=#dbbc7f],#{?pane_in_mode,#[fg=#83c092],#[fg=#a7c080]}}#[bg=#1e2326]#[fg=#272e33,bold]#{?client_prefix,#[bg=#dbbc7f],#{?pane_in_mode,#[bg=#83c092],#[bg=#a7c080]}} #I #W#{?window_zoomed_flag, [z],} #[nobold,bg=#1e2326]#{?client_prefix,#[fg=#dbbc7f],#{?pane_in_mode,#[fg=#83c092],#[fg=#a7c080]}}"
setw -g window-status-activity-style "fg=#dbbc7f"
setw -g monitor-activity on      # background windows turn yellow when they print output
set -g visual-activity off       # ...without a status message

# Window names: folder name while the shell is idle, otherwise the running program
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{m/r:^(fish|zsh|bash|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"
setw -g window-status-bell-style "fg=#e67e80,bold"

# ── Pane borders: thin, quiet labels ──
set -g pane-border-lines single
set -g pane-border-style "fg=#374145"
set -g pane-active-border-style "fg=#a7c080"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#a7c080],#[fg=#7a8478]} #P #[fg=#414b50]· #{?pane_active,#[fg=#d3c6aa],#[fg=#7a8478]}#{pane_current_command} #[fg=#414b50]· #{?pane_active,#[fg=#859289],#[fg=#7a8478]}#{b:pane_current_path} "
# Only show pane labels when a window has more than one (visible) pane
set-hook -g session-created       'set -w -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set-hook -g after-new-window      'set -w -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set-hook -g window-layout-changed 'set -w -F pane-border-status "#{?#{||:#{==:#{window_panes},1},#{window_zoomed_flag}},off,top}"'

# ── Scrollbars (tmux 3.6+) ──
# modal = shown while in copy mode; stays until you leave with q / Escape
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "bg=#2e383c,fg=#7a8478,width=1,pad=0"   # track bg1, thumb grey0

# ── Mouse wheel scrolling ──
# Wheel up enters copy mode WITHOUT -e, so it doesn't auto-exit at the bottom
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode"
# 1 line per wheel tick (default is 5) for smoother scrolling
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down

# ── Messages / prompt ──
set -g message-style "bg=#2e383c,fg=#d3c6aa"
set -g message-command-style "bg=#2e383c,fg=#a7c080"

# ── Copy mode ──
set -g mode-style "bg=#414b50,fg=#dbbc7f"
setw -g copy-mode-line-numbers relative

# ── Popups & menus (tmux 3.3+) ──
set -g popup-border-lines rounded
set -g popup-border-style "fg=#414b50"
set -g menu-style "bg=#272e33,fg=#d3c6aa"
set -g menu-selected-style "bg=#374145,fg=#a7c080"
set -g menu-border-style "fg=#414b50"
set -g menu-border-lines rounded

# ── Misc ──
set -g display-panes-colour "#7a8478"
set -g display-panes-active-colour "#a7c080"
set -g clock-mode-colour "#a7c080"

# Scroll 5 lines instead of half a page
# bind -T copy-mode-vi C-u send-keys -X -N 5 scroll-up
# bind -T copy-mode-vi C-d send-keys -X -N 5 scroll-down

# Move cursor 5 lines up/down
bind -T copy-mode-vi C-u send-keys -X -N 5 cursor-up
bind -T copy-mode-vi C-d send-keys -X -N 5 cursor-down
