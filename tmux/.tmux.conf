# Shell

set -g default-shell /opt/homebrew/bin/fish
# set -g default-shell /bin/bash

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*256col*:RGB"

# Copy mode (vi keys)
set -g mode-keys vi
set -g set-clipboard on

# Behavior
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g mouse on
set -g focus-follows-mouse on
set -g base-index 1              # windows start at 1 (easier to reach on keyboard)
setw -g pane-base-index 1
set -g status-interval 15

# ─────────────────────────────────────────────
# Everforest (Dark, Medium) — minimal
#   bg1 #343f44  bg2 #3d484d  bg3 #475258
#   fg  #d3c6aa  grey0 #7a8478  grey1 #859289
#   green #a7c080  yellow #dbbc7f  aqua #83c092  red #e67e80
# ─────────────────────────────────────────────

# Pane backgrounds follow the terminal
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# ── Status bar: transparent, blends into the terminal ──
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#859289"

# Left: session name in a soft green label
set -g status-left-length 30
set -g status-left "#[fg=#2d353b,bg=#a7c080,bold] #S #[bg=default] "

# Right: shows only when needed (prefix pressed / copy mode), then a quiet clock
set -g status-right-length 40
set -g status-right "#{?client_prefix,#[fg=#dbbc7f]● prefix  ,}#{?pane_in_mode,#[fg=#83c092]● copy  ,}#[fg=#7a8478]%H:%M "

# Window list: plain text, current window gets a soft highlight
set -g window-status-separator ""
setw -g window-status-format         " #[fg=#7a8478]#I #[fg=#859289]#W#{?window_zoomed_flag, [z],} "
setw -g window-status-current-format "#[bg=#3d484d] #[fg=#a7c080]#I #[fg=#d3c6aa,bold]#W#{?window_zoomed_flag,#[fg=#dbbc7f] [z],} "
setw -g window-status-activity-style "fg=#dbbc7f"
setw -g window-status-bell-style "fg=#e67e80,bold"

# ── Pane borders: thin, quiet labels ──
set -g pane-border-lines single           # was: heavy
set -g pane-border-style "fg=#3d484d"
set -g pane-active-border-style "fg=#a7c080"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#a7c080],#[fg=#7a8478]} #P #[fg=#475258]· #{?pane_active,#[fg=#d3c6aa],#[fg=#7a8478]}#{pane_current_command} #[fg=#475258]· #{?pane_active,#[fg=#859289],#[fg=#7a8478]}#{b:pane_current_path} "

# ── Scrollbars (tmux 3.6+) ──
# modal = only while scrolling (copy mode); use "on" to always show
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "bg=#343f44,fg=#7a8478,width=1,pad=0"   # track bg1, thumb grey0

# ── Messages / prompt ──
set -g message-style "bg=#343f44,fg=#d3c6aa"
set -g message-command-style "bg=#343f44,fg=#a7c080"

# ── Copy mode ──
set -g mode-style "bg=#475258,fg=#dbbc7f"
setw -g copy-mode-line-numbers relative

# ── Popups & menus (tmux 3.3+) ──
set -g popup-border-lines rounded
set -g popup-border-style "fg=#475258"
set -g menu-style "bg=#2d353b,fg=#d3c6aa"
set -g menu-selected-style "bg=#3d484d,fg=#a7c080"
set -g menu-border-style "fg=#475258"
set -g menu-border-lines rounded

# ── Misc ──
set -g display-panes-colour "#7a8478"
set -g display-panes-active-colour "#a7c080"
set -g clock-mode-colour "#a7c080"
